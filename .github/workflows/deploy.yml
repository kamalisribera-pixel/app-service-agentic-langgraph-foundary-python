name: Build and Deploy FastAPI to Azure App Service

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Archive application
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".venv/*" \
            -x "__pycache__/*"
      - name: Check Secrets
        run: |
          echo "CLIENT_ID=${{ secrets.AZURE_CLIENT_ID != '' }}"
          echo "TENANT_ID=${{ secrets.AZURE_TENANT_ID != '' }}"
          echo "SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"
          echo "CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET != '' }}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: appservice-agentic-langgraph-foundry-python
          package: release.zip
